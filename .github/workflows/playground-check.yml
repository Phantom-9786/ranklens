name: Accessibility playground
on:
  push:
    branches: [codex/accessibility-playground]
  pull_request:
    paths: ['playground/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
