name: Streaming audit checks
on:
  push:
    branches: [codex/streaming-audit-chat]
  pull_request:
    paths: ['src/**', 'package.json', 'package-lock.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
